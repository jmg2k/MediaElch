name: Windows Build

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: "Qt version (exact, e.g. 6.8.3)"
        required: false
        default: "6.8.3"
      build_type:
        description: "CMake build type"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Managed here (not by install-qt-action's cache) so a cache hit skips the
      # action entirely, including its ~17s pip install of aqtinstall.
      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.workspace }}/Qt
          key: qt-${{ runner.os }}-${{ inputs.qt_version }}-msvc2022_64-qtmultimedia-qt5compat-v1

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ inputs.qt_version }}
          arch: win64_msvc2022_64
          modules: qtmultimedia qt5compat
          cache: false
          # Use the runner's Python 3.12 (prebuilt wheels) instead of 3.15,
          # which compiles py7zr's dependencies from source on every run.
          setup-python: false

      - name: Save Qt cache
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.workspace }}/Qt
          key: qt-${{ runner.os }}-${{ inputs.qt_version }}-msvc2022_64-qtmultimedia-qt5compat-v1

      - name: Set up Qt environment from cache
        if: steps.qt-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $root = "$env:RUNNER_WORKSPACE\Qt\${{ inputs.qt_version }}\msvc2022_64"
          if (-not (Test-Path "$root\bin\qmake.exe")) { throw "Cached Qt not found at $root" }
          "QT_ROOT_DIR=$root" >> $env:GITHUB_ENV
          "QT_PLUGIN_PATH=$root\plugins" >> $env:GITHUB_ENV
          "QML2_IMPORT_PATH=$root\qml" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            C:/vcpkg/downloads
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-zlib-v1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-${{ inputs.qt_version }}-${{ inputs.build_type }}
          max-size: 500M

      - name: Install zlib (needed by QuaZip)
        shell: pwsh
        run: vcpkg install zlib:x64-windows-static-md --vcpkg-root=C:/vcpkg

      # Save right after install so the cache survives a failing build.
      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            C:/vcpkg/downloads
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-zlib-v1

      # MediaElch loads MediaInfo.dll at runtime but needs the MediaInfoDLL and
      # ZenLib headers at compile time (system includes on Linux).
      - name: Fetch MediaInfo
        shell: pwsh
        run: |
          $mi = "26.10"; $zen = "0.4.41"
          $base = "https://mediaarea.net/download"
          New-Item -ItemType Directory -Force deps | Out-Null
          Invoke-WebRequest "$base/binary/libmediainfo0/$mi/MediaInfo_DLL_${mi}_Windows_x64_WithoutInstaller.zip" -OutFile deps/mi.zip
          Invoke-WebRequest "$base/source/libzen/$zen/libzen_$zen.tar.gz" -OutFile deps/zen.tar.gz
          Expand-Archive deps/mi.zip -DestinationPath deps/mediainfo
          tar -xzf deps/zen.tar.gz -C deps
          if (-not (Test-Path deps/mediainfo/MediaInfo.dll)) { throw "MediaInfo.dll missing" }
          if (-not (Test-Path deps/ZenLib/Source/ZenLib/Ztring.h)) { throw "ZenLib headers missing" }
          # cl.exe reads %INCLUDE%; append the header dirs for later steps.
          $ws = $env:GITHUB_WORKSPACE
          "INCLUDE=$env:INCLUDE;$ws\deps\mediainfo\Developers\Source;$ws\deps\ZenLib\Source" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ inputs.build_type }}
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DMEDIAELCH_FORCE_QT6=ON
          -DENABLE_TESTS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/MediaElch | Out-Null
          Copy-Item build/MediaElch.exe dist/MediaElch/
          Copy-Item deps/mediainfo/MediaInfo.dll dist/MediaElch/
          # Project-built shared libs (QuaZip) are not picked up by windeployqt.
          Get-ChildItem build -Recurse -Filter *.dll | ForEach-Object { Copy-Item $_.FullName dist/MediaElch/ }
          # Scan every binary we ship, not just the exe: QuaZip needs Qt6Core5Compat,
          # which the exe itself does not import.
          windeployqt --release --no-translations dist/MediaElch/MediaElch.exe (Get-ChildItem dist/MediaElch/*.dll | Where-Object { $_.Name -notmatch '^(Qt6|avcodec|avformat|avutil|swresample|swscale|d3dcompiler|dxcompiler|dxil|opengl32sw|MediaInfo)' } | ForEach-Object FullName)
          # Optional SQL drivers we don't use; they need libpq / Mimer which we don't ship.
          Remove-Item dist/MediaElch/sqldrivers/qsqlpsql.dll, dist/MediaElch/sqldrivers/qsqlmimer.dll -ErrorAction SilentlyContinue

      - name: Verify all DLL imports resolve
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          python -I .github/scripts/check_imports.py dist/MediaElch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaElch-windows-x64
          path: dist/MediaElch
